[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishanalyzer"
version = "0.1.0"
description = "Local, static triage for reported phishing/spam emails (.eml/.msg)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "rich>=13.7",
    "extract-msg>=0.48",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[project.scripts]
phishanalyzer = "phishanalyzer.cli:main"

[tool.setuptools]
packages = ["phishanalyzer", "phishanalyzer.analyzers"]

[tool.setuptools.package-data]
phishanalyzer = ["indicators.json"]
